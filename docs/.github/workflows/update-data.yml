name: Update ETF signal data

on:
  schedule:
    # Runs every 30 minutes, Mon-Fri, during roughly 9am-5pm US Eastern (13:00-21:00 UTC).
    # Adjust the cron below if you want a different schedule.
    - cron: '*/30 13-21 * * 1-5'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run analyzer
        run: node analyzer.js SOXL TQQQ SQQQ SOXS SPXS UPRO TMF LABU SPXL FNGU

      - name: Commit updated results.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/results.json
          git diff --staged --quiet || git commit -m "Update results.json [skip ci]"
          git push
